<style>
/* Layout: full-height 3D stage on the left, a module rail + part card on the right (stacks under the stage on phones). */
:root{
  --bg:#eef2f4; --panel:#ffffff; --ink:#15202b; --muted:#5b6873; --line:#d6dde2;
  --accent:#e8710a; --accent-ink:#ffffff; --stage:#e4e9ec; --chip:#f4f6f8; --warn:#9a5b00; --warn-bg:#fff2dc;
  --f-body:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161b; --panel:#182028; --ink:#e7edf2; --muted:#9aa8b4; --line:#2a3540;
  --accent:#ff8a2a; --accent-ink:#1a1006; --stage:#151c22; --chip:#1f2932; --warn:#ffc46b; --warn-bg:#3a2a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161b; --panel:#182028; --ink:#e7edf2; --muted:#9aa8b4; --line:#2a3540;
  --accent:#ff8a2a; --accent-ink:#1a1006; --stage:#151c22; --chip:#1f2932; --warn:#ffc46b; --warn-bg:#3a2a12; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px;gap:12px 16px;box-sizing:border-box}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.02em;text-wrap:balance}
h1 small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500;margin-left:8px;letter-spacing:.04em}
.hint{color:var(--muted);font-size:13px}
.stage{position:relative;min-height:0;border-radius:10px;background:var(--stage);overflow:hidden;border:1px solid var(--line)}
canvas{display:block;width:100%;height:100%;touch-action:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
.bar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;
  background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.bar label{font-size:13px;color:var(--muted);white-space:nowrap}
.bar input[type=range]{flex:1 1 140px;min-width:0;accent-color:var(--accent)}
button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:7px;padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;white-space:nowrap;transform:translate(10px,10px)}
aside{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px}
.rail{display:flex;flex-direction:column;gap:6px}
.rail h2,.card h2{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 2px;letter-spacing:.06em}
.mod{display:grid;grid-template-columns:12px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;padding:7px 10px;background:var(--panel)}
.mod .dot{width:12px;height:12px;border-radius:3px}
.mod .k{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mod[aria-pressed="true"]{box-shadow:inset 3px 0 0 var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{margin:0 0 6px;font-size:17px;text-wrap:balance}
.card p{margin:0 0 8px}
.card dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:8px 0 0;font-size:13px}
.card dt{color:var(--muted)} .card dd{margin:0;font-variant-numeric:tabular-nums}
.tbc{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:var(--warn-bg);color:var(--warn);margin-left:6px;vertical-align:1px}
.part{font-size:13px;color:var(--muted);margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.part b{color:var(--ink);font-weight:500}
.foot{font-size:12px;color:var(--muted)}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 62vh auto;height:auto}
  h1{font-size:18px} h1 small{display:block;margin-left:0}
  html,body{height:auto}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>

function baseColor(p){

  if(n.startsWith('M3508 P19')||n.startsWith('GM6020 云台')) return 0x23272d;
  if(n.startsWith('M2006 P36')) return 0x3b4048;
  if(n.startsWith('轮子')) return 0xe8710a;
  if(n.startsWith('弹簧')) return 0xb9c1c9;
  if(n.startsWith('M3×0.5')) return 0xc9a227;
  if(n.startsWith('锥齿轮')) return 0xb48a4d;
  if(n.startsWith('轮轴三通')) return 0x4f86c6;
  return 0xe6e1d8;
}

const controls=new OrbitControls(camera,canvas); controls.enableDamping=true; controls.dampingFactor=0.08;
scene.add(new THREE.HemisphereLight(0xffffff,0x6d6a64,1.5));
const key=new THREE.DirectionalLight(0xffffff,2.0); key.position.set(400,700,500); scene.add(key);
const rim=new THREE.DirectionalLight(0xffffff,0.7); rim.position.set(-500,200,-400); scene.add(rim);

function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim();}
function applyTheme(){scene.background=new THREE.Color(cssVar('--stage')||'#e4e9ec');}
applyTheme(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

const root=new THREE.Group(); scene.add(root);
const meshes=[]; let units={};

async function load(){
  const res=await fetch('robot.bin'); if(!res.ok) throw new Error('robot.bin '+res.status); const buf=await res.arrayBuffer();
  const s=PARTS.scale, o=PARTS.off;
  for(const p of PARTS.parts){
    const q=new Int16Array(buf,p.po,p.vc*3), pos=new Float32Array(p.vc*3);
    // robot axis is STEP Y; map it to scene X, STEP Z to scene Y.
    for(let i=0;i<p.vc;i++){
      const x=q[i*3]*s+o[0], y=q[i*3+1]*s+o[1], z=q[i*3+2]*s+o[2];
      pos[i*3]=y-230; pos[i*3+1]=z-38; pos[i*3+2]=x;
    }
    const idx=p.i32?new Uint32Array(buf,p.io,p.ic):new Uint16Array(buf,p.io,p.ic);
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setIndex(new THREE.BufferAttribute(idx,1)); g.computeVertexNormals();
    const mat=new THREE.MeshStandardMaterial({color:baseColor(p),roughness:.55,metalness:.12,transparent:true,opacity:1});
    const m=new THREE.Mesh(g,mat); m.userData.p=p; m.userData.base=baseColor(p); root.add(m); meshes.push(m);
    (units[p.u]=units[p.u]||[]).push(m);
  }
  // explode vector per rigid unit: module shift along the axis + radial push + spread inside the module
  const modY={}; for(const m of meshes){const k=m.userData.p.m;(modY[k]=modY[k]||[]).push(m.userData.p.c[1]);}
  for(const k in modY){const a=modY[k];modY[k]=a.reduce((s,v)=>s+v,0)/a.length;}
  for(const id in units){
    const list=units[id]; const c=[0,0,0]; list.forEach(m=>m.userData.p.c.forEach((v,i)=>c[i]+=v/list.length));
    const k=list[0].userData.p.m, mod=MOD[k];
    const radial=(k==='front'||k==='rear')?0.75:0.45;
    const v=new THREE.Vector3(mod.ax*1.0+(c[1]-modY[k])*0.25, (c[2]-38)*radial, c[0]*radial*0.9);
    list.forEach(m=>m.userData.ex=v);
  }
  document.getElementById('loading').hidden=true;
  frame(); setExplode(0); select(null);
}

function frame(){
  // frame the fully exploded model so both states fit without moving the camera
  const keep=ex; setExplode(1); const box=new THREE.Box3().setFromObject(root); setExplode(keep);
  const size=box.getSize(new THREE.Vector3()), ctr=box.getCenter(new THREE.Vector3());
  const r=size.length()/2, vf=camera.fov*Math.PI/180, hf=2*Math.atan(Math.tan(vf/2)*camera.aspect);
  const d=r/Math.sin(Math.min(vf,hf)/2)*0.78;
  const dir=new THREE.Vector3(-0.18,0.38,0.9).normalize();
  camera.position.copy(ctr).addScaledVector(dir,d); controls.target.copy(ctr); controls.update();
}

let ex=0, target=0;
function setExplode(t){ex=t; for(const m of meshes){m.position.copy(m.userData.ex).multiplyScalar(t);} }
const exInput=document.getElementById('ex'), toggle=document.getElementById('toggle');
exInput.addEventListener('input',()=>{target=exInput.value/100;setExplode(target);updateToggle();});
toggle.addEventListener('click',()=>{target=target>0.5?0:1;updateToggle();});
function updateToggle(){toggle.textContent=target>0.5?'一键组装':'一键拆解';}
let spinning=false; const spinBtn=document.getElementById('spin');
spinBtn.addEventListener('click',()=>{spinning=!spinning;spinBtn.setAttribute('aria-pressed',spinning);controls.autoRotate=spinning;controls.autoRotateSpeed=1.2;});
document.getElementById('home').addEventListener('click',frame);

// module rail
const rail=document.getElementById('rail'); const btns={};
MODULES.forEach((m,i)=>{const b=document.createElement('button');b.type='button';b.className='mod';b.setAttribute('aria-pressed','false');
  b.innerHTML=`<span class="dot" style="background:${m.c}"></span><span>${m.t}</span><span class="k">${String(i+1).padStart(2,'0')}</span>`;
  b.addEventListener('click',()=>select(cur===m.k?null:m.k));rail.appendChild(b);btns[m.k]=b;});

let cur=null, curPart=null;
function select(k,part){
  cur=k; curPart=part||null;
  for(const key in btns) btns[key].setAttribute('aria-pressed',key===k);
  for(const m of meshes){
    const on=!k||m.userData.p.m===k;
    m.material.opacity=on?1:0.12; m.material.depthWrite=on;
    // structural (printed) parts take the module colour when selected; motors, wheels, springs keep their own
    if(k&&on&&m.userData.base===0xe6e1d8) m.material.color.set(MOD[k].c).lerp(new THREE.Color(0xffffff),0.35);
    else m.material.color.setHex(m.userData.base);
  }
  const card=document.getElementById('card');
  if(!k){card.innerHTML=`<h2>使用说明</h2><h3>点击左侧模型或右侧列表</h3><p>整机长约 663 mm，沿轴线从前到后分为七个功能模块。选中后其余部分会变淡；拖动“拆解程度”可以逐步拆开整机。</p><dl><dt>适用管径</dt><dd>135–200 mm（团队设计值）</dd><dt>当前能力</dt><dd>直管、竖直与斜向管段；转弯功能在后续版本</dd></dl>`;return;}
  const m=MOD[k];
  card.innerHTML=`<h2>模块 ${String(MODULES.indexOf(m)+1).padStart(2,'0')}</h2><h3>${m.t}</h3><p>${m.d}</p><dl>${m.kv.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>`+
    (curPart?`<div class="part">选中零件：<b>${curPart.n.replace('（待确认）','')}</b>${curPart.n.includes('待确认')?'<span class="tbc">待确认</span>':''}</div>`:'');
}

// picking + hover
const ray=new THREE.Raycaster(), ptr=new THREE.Vector2(); let down=null;
function pick(e){const r=canvas.getBoundingClientRect();ptr.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(meshes.filter(m=>m.material.opacity>0.5),false);return hits[0]?hits[0].object:null;}
canvas.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY];});
canvas.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(moved>5)return;
  const o=pick(e); if(!o){select(null);return;} select(o.userData.p.m,o.userData.p);});
const tip=document.getElementById('tip');
canvas.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||down){tip.hidden=true;return;}const o=pick(e);
  if(!o){tip.hidden=true;canvas.style.cursor='';return;}canvas.style.cursor='pointer';const r=stage.getBoundingClientRect();
  tip.textContent=o.userData.p.n.replace('（待确认）','')+' · '+MOD[o.userData.p.m].t;tip.style.left=(e.clientX-r.left)+'px';tip.style.top=(e.clientY-r.top)+'px';tip.hidden=false;});
canvas.addEventListener('pointerleave',()=>{tip.hidden=true;});

function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/Math.max(1,r.height);camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage); resize();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(){requestAnimationFrame(loop);
  if(Math.abs(ex-target)>0.001){const n=reduce?target:ex+(target-ex)*0.12;setExplode(n);exInput.value=Math.round(n*100);}
  controls.update(); renderer.render(scene,camera);}
load().then(()=>{loop();window.__ready=true;}).catch(err=>{document.getElementById('loading').textContent='模型载入失败：'+err.message;});
</script>

</body>
</html>
